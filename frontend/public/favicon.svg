<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Same citadel glyph as BrandMark.tsx/icons.tsx's IconCitadel, baked
       into a standalone favicon (which can't reach Tailwind's bg-accent
       token) — the two accent hex values below are copied from
       src/styles/theme.css's :root/[data-theme="dark"] blocks and must
       be kept in sync if that palette ever changes. -->
  <style>
    .bg { fill: #33488a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #8098db; }
    }
  </style>
  <rect width="20" height="20" rx="4.3" class="bg" />
  <g fill="#ffffff">
    <path d="M2 3h4v4H2zM8 3h4v4H8zM14 3h4v4h-4z" />
    <path d="M2 7h16l1 10H1z" />
    <rect x="8.5" y="12" width="3" height="5" rx="0.4" opacity="0.35" />
  </g>
</svg>
